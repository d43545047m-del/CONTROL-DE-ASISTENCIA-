<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>📌 Registro de Asistencia y Tardanzas</h2>
      <a href="reportes.html" class="btn btn-outline-primary">Ver Gráficos y Reportes</a>
    </div>

    <div class="card shadow-sm p-4">
      <form id="attendanceForm">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Grado</label>
            <select id="grado" class="form-select" required>
              <option value="">Seleccionar...</option>
              <option value="1° Primaria">1° Primaria</option>
              <option value="2° Primaria">2° Primaria</option>
              <option value="1° Secundaria">1° Secundaria</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Aula / Sección</label>
            <select id="aula" class="form-select" required>
              <option value="">Seleccionar...</option>
              <option value="A">Aula A</option>
              <option value="B">Aula B</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Estudiante</label>
            <input type="text" id="estudiante" class="form-control" placeholder="Nombre completo" required>
          </div>

          <div class="col-md-3">
            <label class="form-label">Estado</label>
            <select id="estado" class="form-select" required>
              <option value="Tardanza">Tardanza</option>
              <option value="Inasistencia">Inasistencia</option>
            </select>
          </div>

          <div class="col-md-12 text-end mt-3">
            <button type="submit" class="btn btn-success">Guardar Registro</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
