<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes y Gráficos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Carga de Chart.js obligatoria -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>📊 Dashboard de Incidencias</h2>
      <a href="index.html" class="btn btn-secondary">← Volver al Registro</a>
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card p-3 shadow-sm">
          <h5 class="card-title text-center">Incidencias por Estado</h5>
          <div style="position: relative; height:300px;">
            <canvas id="chartEstado"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3 shadow-sm">
          <h5 class="card-title text-center">Incidencias por Grado</h5>
          <div style="position: relative; height:300px;">
            <canvas id="chartGrado"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

<!-- Librería Chart.js para dibujar los gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Tu script local -->
  <script src="charts.js"></script>
</body>
</html>
